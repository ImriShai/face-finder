server {
    listen 80;

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 500m;
        # Let the backend set cache headers per endpoint
        proxy_pass_header Cache-Control;
    }

    # Hash-named build assets never change content under the same URL
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The SPA entry point must always revalidate, otherwise browsers keep
    # serving a stale bundle after a deploy (ETag makes the check cheap).
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
